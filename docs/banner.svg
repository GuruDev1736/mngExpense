<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="MngExpense — track every rupee, beautifully">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F3B"/>
      <stop offset="0.55" stop-color="#26306B"/>
      <stop offset="1" stop-color="#2A78D6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow)"/>

  <!-- soft decorative circles -->
  <circle cx="90" cy="380" r="120" fill="#ffffff" opacity="0.04"/>
  <circle cx="1210" cy="40" r="90" fill="#ffffff" opacity="0.05"/>

  <!-- Title block -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="80" y="150" font-size="76" font-weight="700" letter-spacing="-1">
      <tspan fill="#ffffff">Mng</tspan><tspan fill="#9EC5FF">Expense</tspan>
    </text>
    <text x="82" y="205" font-size="28" opacity="0.9">Track every rupee — beautifully.</text>
    <text x="82" y="245" font-size="20" opacity="0.65">Expense tracker for Android · Jetpack Compose · Material 3</text>

    <!-- feature pills -->
    <g font-size="17" font-weight="600">
      <rect x="80" y="285" width="158" height="44" rx="22" fill="#ffffff" opacity="0.12"/>
      <text x="159" y="313" text-anchor="middle">📊  Smart charts</text>
      <rect x="252" y="285" width="168" height="44" rx="22" fill="#ffffff" opacity="0.12"/>
      <text x="336" y="313" text-anchor="middle">📄  PDF &amp; Excel</text>
      <rect x="434" y="285" width="150" height="44" rx="22" fill="#ffffff" opacity="0.12"/>
      <text x="509" y="313" text-anchor="middle">🌙  Dark mode</text>
      <rect x="598" y="285" width="150" height="44" rx="22" fill="#ffffff" opacity="0.12"/>
      <text x="673" y="313" text-anchor="middle">🔒  100% offline</text>
    </g>
  </g>

  <!-- Card with donut + bars -->
  <g filter="url(#shadow)">
    <rect x="850" y="60" width="350" height="300" rx="26" fill="#F6F7FC"/>
  </g>
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="878" y="100" font-size="16" font-weight="600" fill="#1B1F3B">Spending by category</text>

    <!-- donut: r=62, circumference ≈ 389.6 ; slices 35/22/16/12/9/6 % -->
    <g transform="translate(960 220) rotate(-90)" fill="none" stroke-width="22">
      <circle r="62" stroke="#2A78D6" stroke-dasharray="134.4 389.6" stroke-dashoffset="0"/>
      <circle r="62" stroke="#1BAF7A" stroke-dasharray="83.7 389.6" stroke-dashoffset="-136.4"/>
      <circle r="62" stroke="#EDA100" stroke-dasharray="60.3 389.6" stroke-dashoffset="-222.1"/>
      <circle r="62" stroke="#EB6834" stroke-dasharray="44.8 389.6" stroke-dashoffset="-284.4"/>
      <circle r="62" stroke="#008300" stroke-dasharray="33.1 389.6" stroke-dashoffset="-331.2"/>
      <circle r="62" stroke="#E87BA4" stroke-dasharray="21.4 389.6" stroke-dashoffset="-366.3"/>
    </g>
    <text x="960" y="214" text-anchor="middle" font-size="12" fill="#5B6178">Total</text>
    <text x="960" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#1B1F3B">₹19,480</text>

    <!-- mini bar chart -->
    <g fill="#4A5A9A">
      <rect x="1062" y="262" width="16" height="58" rx="3"/>
      <rect x="1084" y="200" width="16" height="120" rx="3"/>
      <rect x="1106" y="240" width="16" height="80" rx="3"/>
      <rect x="1128" y="282" width="16" height="38" rx="3"/>
      <rect x="1150" y="226" width="16" height="94" rx="3"/>
    </g>
    <line x1="1056" y1="320" x2="1172" y2="320" stroke="#C9CDE0" stroke-width="1.5"/>
    <text x="1114" y="342" text-anchor="middle" font-size="12" fill="#5B6178">This week</text>
  </g>
</svg>
